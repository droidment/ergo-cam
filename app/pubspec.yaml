name: ergocam
description: "ErgoCam — live REBA/OWAS posture scoring from the phone camera (internal demo)."
publish_to: 'none'

version: 0.4.0+4

environment:
  sdk: ^3.13.0

dependencies:
  camera: ^0.12.1
  ergo_core:
    path: ../packages/ergo_core
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_mlkit_pose_detection: ^0.16.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  video_player: ^2.14.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
